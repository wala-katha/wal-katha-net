name: Smart Optimize Images (JPG/PNG to WebP + Frontmatter Auto-Update)
# 🎯 FIXED (CRITICAL — Unnecessary CI Runs on Every Push):
# ROOT CAUSE: "on.push.branches: [main]" had NO "paths" filter, so this
# workflow fired on EVERY single commit to main — routing changes,
# config edits, README updates, pagination logic, anything — even when
# zero image files were touched. This wasted CI/CD minutes, added noise
# to every commit's checks list, and ran in parallel with Cloudflare
# Pages builds for no reason.
#
# PERMANENT FIX: A "paths" filter scopes the push trigger to only fire
# when a commit actually touches an image file or this workflow itself.
# This is self-healing/future-proof: any new image dropped into any of
# these folders, or any new root-level jpg/png added later, is
# automatically covered by the glob patterns below.
on:
  push:
    branches: [main]
    paths:
      - "public/images/posts/**"
      - "public/images/slider/**"
      - "public/images/authors/**"
      - "public/images/*.jpg"
      - "public/images/*.jpeg"
      - "public/images/*.png"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Sharp in temp folder
        run: |
          mkdir -p /tmp/sharp-tool
          cd /tmp/sharp-tool
          npm init -y
          npm install sharp
      - name: Smart Optimize + Auto-Update Frontmatter
        run: |
          node --input-type=module << 'EOF'
          import { createRequire } from 'module';
          const require = createRequire('/tmp/sharp-tool/package.json');
          const sharp = require('sharp');
          import { readdirSync, existsSync, readFileSync, writeFileSync, statSync } from 'fs';
          import { join, dirname, basename } from 'path';
          import { createHash } from 'crypto';
          // ==========================================================
          // 🎯 SMART CONFIG — site එකේ ඇත්තටම display කරන actual pixel
          //    sizes එකට ගැලපෙන (2x retina සඳහා ටිකක් වැඩිය) maximum
          //    widths. Height දෙන්නේ නෑ — aspect ratio ස්වභාවිකව පවතී,
          //    crop/distort කිසිවක් සිදු නොවේ (proportional resize only).
          //
          //    🎯 NEW (2026-07 — PageSpeed "Improve image delivery" fix,
          //    slide-2.webp flagged: 86.6 KiB delivered on mobile,
          //    displayed at only ~11.7 KiB worth of pixels): the
          //    "slider" folder has been REMOVED from this generic
          //    single-output array and is now handled by its own
          //    dedicated dual-output block further below (desktop
          //    1200w master UNCHANGED + a new lightweight ~700w
          //    "-mobile.webp" companion file). This was necessary
          //    because FeaturedSlider.astro previously had ZERO
          //    responsive srcset/picture logic at all — every device,
          //    including small phones, always downloaded the full
          //    1200px master. Posts/authors are untouched and still
          //    use this single-output generic pipeline exactly as
          //    before.
          // ==========================================================
          const folders = [
            { dir: 'public/images/posts',   maxWidth: 420,  type: 'post'   },
            { dir: 'public/images/authors', maxWidth: 150,  type: 'author', square: true },
          ];
          const convertedMap = {};       // { "old-filename.jpg": "new-filename.webp" } — filename actually changed
          const forceVerifySet = new Set(); // Set of .webp OUTPUT paths whose SOURCE content changed but
                                             // filename stayed the same (already .webp-referenced everywhere) —
                                             // these still need every downstream reference double-checked.
          let skippedCount = 0;
          let processedCount = 0;
          // ==========================================================
          // 🎯 UNIVERSAL CONTENT-HASH GUARD (NEW — applies to EVERY
          //    single image processed by this workflow: post images,
          //    slider images, author images, root images, logo,
          //    favicon, og-image, AND app-icon — no exceptions).
          //
          //    ROOT CAUSE THIS SOLVES: previously, "up to date" was
          //    decided purely by file MODIFICATION TIMESTAMP + pixel
          //    DIMENSIONS. If someone re-uploaded a *replacement* image
          //    with the exact same filename (e.g. re-uploading
          //    "logo.png" with new artwork, or replacing
          //    "Nandage-duwa-wal-katha.jpg" with a different photo but
          //    keeping the same name), git checkout can restore a
          //    fresh mtime, BUT if the resulting .webp already existed
          //    with matching dimensions, the OLD staleness check would
          //    wrongly report "already up to date" and skip
          //    reconversion — silently leaving stale artwork live.
          //    Only app-icon.jpg had a manual, one-off workaround for
          //    this (the "appIconConverted" boolean) — every other
          //    image type had zero protection against this scenario.
          //
          //    THE FIX: every source image now gets a tiny sidecar
          //    hash file (e.g. "logo.png.hash" next to "logo.png",
          //    committed to the repo like any other tracked file)
          //    containing a SHA-256 digest of the source file's bytes.
          //    On every run, we compare the CURRENT source file's hash
          //    against the sidecar's stored hash:
          //      - Hash file missing (first-ever run for this image)
          //        -> treat as "content changed" (force reconvert +
          //           force downstream re-verify), and write the hash
          //           sidecar for next time.
          //      - Hash mismatch (content genuinely replaced, filename
          //        identical) -> force reconvert + force downstream
          //        re-verify, update the hash sidecar.
          //      - Hash match -> content is byte-identical to last
          //        run; fall through to the existing timestamp+
          //        dimension check as a secondary/cheap early-exit.
          //
          //    ⚠️ IMPORTANT (2026-07 slider dual-output note): this
          //    function has a SIDE EFFECT — it writes the updated hash
          //    sidecar to disk the moment it detects a change. Calling
          //    it TWICE for the same source file within the same run
          //    (e.g. once for a "desktop" output decision and once for
          //    a "mobile" output decision) would make the SECOND call
          //    wrongly report "unchanged" even on a genuine content
          //    change, because the sidecar was already updated by the
          //    first call. The new slider block further below calls
          //    this function EXACTLY ONCE per source file and reuses
          //    the single boolean result for both its desktop and
          //    mobile output decisions, to avoid this exact pitfall.
          //    The 2026-08 post-thumbnail block (see the "folders"
          //    loop further below) follows this exact same rule too.
          //
          //    This single mechanism now uniformly covers EVERY image
          //    in every folder + every root/logo/favicon/og-image/
          //    app-icon path — no per-image special-casing required,
          //    and it is fully self-healing for any image added in the
          //    future (new post images, new author avatars, a
          //    replaced slider photo, etc.) with zero manual upkeep.
          // ==========================================================
          function computeFileHash(filePath) {
            const buf = readFileSync(filePath);
            return createHash('sha256').update(buf).digest('hex');
          }
          function hasSourceContentChanged(inputPath) {
            const hashSidecarPath = `${inputPath}.hash`;
            const currentHash = computeFileHash(inputPath);
            if (!existsSync(hashSidecarPath)) {
              // First time we've ever seen this source file (or the
              // sidecar was deleted) — treat conservatively as changed
              // so it gets (re)converted and downstream-verified once.
              writeFileSync(hashSidecarPath, currentHash, 'utf-8');
              return true;
            }
            const storedHash = readFileSync(hashSidecarPath, 'utf-8').trim();
            if (storedHash !== currentHash) {
              writeFileSync(hashSidecarPath, currentHash, 'utf-8');
              return true;
            }
            return false; // byte-identical to the last successful run
          }
          // ==========================================================
          // ⚡ SMART STALENESS CHECK — secondary/cheap check, now only
          //    reached AFTER the content-hash guard above has already
          //    confirmed the source bytes are unchanged. Still verifies
          //    timestamp + dimensions match, as a defensive fallback in
          //    case the .webp itself was manually deleted or corrupted
          //    even though the source hash didn't change.
          // ==========================================================
          async function isUpToDate(input, out, targetWidth, isSquare = false) {
            if (!existsSync(out)) return false;
            const srcTime = statSync(input).mtimeMs;
            const outTime = statSync(out).mtimeMs;
            if (outTime < srcTime) return false;
            try {
              const outMeta = await sharp(out).metadata();
              const srcMeta = await sharp(input).metadata();
              const expectedWidth = Math.min(srcMeta.width || targetWidth, targetWidth);
              if (Math.abs((outMeta.width || 0) - expectedWidth) > 2) return false;
              if (isSquare) {
                const expectedHeight = Math.min(srcMeta.height || targetWidth, targetWidth);
                const expectedSquareHeight = srcMeta.width && srcMeta.height &&
                  Math.min(srcMeta.width, srcMeta.height) >= targetWidth
                  ? targetWidth
                  : expectedHeight;
                if (Math.abs((outMeta.height || 0) - expectedSquareHeight) > 2) return false;
              }
              return true;
            } catch {
              return false;
            }
          }
          // Combined decision: content-hash guard takes priority. Only
          // if content is byte-identical do we fall back to the
          // cheaper timestamp/dimension check.
          async function shouldReconvert(input, out, targetWidth, isSquare = false) {
            const contentChanged = hasSourceContentChanged(input);
            if (contentChanged) return true;
            const upToDate = await isUpToDate(input, out, targetWidth, isSquare);
            return !upToDate;
          }
          for (const { dir, maxWidth, type, square } of folders) {
            if (!existsSync(dir)) continue;
            for (const file of readdirSync(dir)) {
              if (!/\.(jpg|jpeg|png)$/i.test(file)) continue;
              const input = join(dir, file);
              const outFile = file.replace(/\.[^.]+$/, '.webp');
              const out = join(dir, outFile);
              // ==========================================================
              // 🎯 2026-08 PERMANENT FIX (PageSpeed "Improve image
              //    delivery" recurring flag on every new post): the
              //    content-hash guard below is now evaluated EXACTLY
              //    ONCE per source file and its boolean result
              //    ("contentChanged") is reused for BOTH the primary
              //    full-size output decision below AND the new
              //    post-grid-thumbnail decision further down — calling
              //    hasSourceContentChanged() a second time for the same
              //    file would wrongly report "unchanged" on the second
              //    call, since it writes the updated hash sidecar as a
              //    side effect on the first call (same rule the slider
              //    dual-output block already follows — see that
              //    function's own doc-comment above for the full
              //    explanation).
              // ==========================================================
              const contentChanged = hasSourceContentChanged(input);
              const primaryUpToDate = contentChanged
                ? false
                : await isUpToDate(input, out, maxWidth, square);
              const needsPrimaryReconvert = contentChanged || !primaryUpToDate;
              if (needsPrimaryReconvert) {
                // If the .webp already existed (filename unchanged) but
                // content forced a reconvert, flag it for the universal
                // downstream re-verify pass below.
                if (existsSync(out)) {
                  forceVerifySet.add(out);
                }
                const image = sharp(input);
                const metadata = await image.metadata();
                let pipeline = image;
                if (square) {
                  pipeline = pipeline.resize({
                    width: maxWidth,
                    height: maxWidth,
                    fit: 'cover',
                    position: 'attention',
                    withoutEnlargement: true,
                    kernel: sharp.kernel.lanczos3,
                  });
                } else if (metadata.width && metadata.width > maxWidth) {
                  pipeline = pipeline.resize({
                    width: maxWidth,
                    withoutEnlargement: true,
                    kernel: sharp.kernel.lanczos3,
                  });
                }
                await pipeline
                  .webp({ quality: 85, smartSubsample: true, effort: 6 })
                  .toFile(out);
                console.log(`[${type.toUpperCase()}] ${file} (${metadata.width}x${metadata.height}) -> ${outFile}`);
                convertedMap[file] = outFile;
                processedCount++;
              } else {
                skippedCount++;
              }
              // ==========================================================
              // 🎯 NEW (2026-08): POST GRID-THUMBNAIL DUAL-OUTPUT — fixes
              //    the recurring PageSpeed "Improve image delivery" flag
              //    on Posts.astro's grid card images (e.g. Wanamalee,
              //    Nandage Duwa flagged repeatedly: delivered ~397x598
              //    vs a real displayed-box requirement of only
              //    ~326x464).
              //
              //    ROOT CAUSE THIS SOLVES: post.data.image in
              //    content.config.ts is a plain z.string() path into
              //    this exact folder, not an Astro-imported asset.
              //    Astro's <Image> component cannot generate real,
              //    distinct-sized files for such string paths at build
              //    time (that capability only exists for imported
              //    assets or content-collection image() helper
              //    fields). Because of this, any responsive
              //    widths/sizes markup previously applied in
              //    Posts.astro to this style of image reference was
              //    COSMETIC ONLY — every srcset width descriptor
              //    pointed at the exact same single ~420px source
              //    file, so the browser always downloaded that one
              //    full file regardless of which width it appeared to
              //    select. No amount of sizes-attribute tuning could
              //    ever fix this, since sizes was never the actual
              //    bottleneck — the srcset itself was non-functional
              //    for this kind of image reference.
              //
              //    THE FIX: generate a genuinely separate, correctly
              //    small physical file ("<name>-thumb.webp", capped at
              //    340px wide — comfortably above the ~326px PageSpeed
              //    reported as the real requirement for this grid
              //    slot, with headroom for higher-DPR devices)
              //    specifically for grid-card usage. Posts.astro
              //    references this exact file directly instead of
              //    relying on Astro's non-functional responsive
              //    srcset for public-string image paths.
              //
              //    CONTENT-HASH GUARD REUSE: uses the SAME
              //    "contentChanged" boolean computed once above for
              //    this source file (see the note directly above the
              //    primary-output block) — never calls
              //    hasSourceContentChanged() a second time for the
              //    same file.
              //
              //    SELF-HEALING: any new post image dropped into this
              //    folder is automatically picked up by this same loop
              //    and gets BOTH the full-size file (used by
              //    PostSingle.astro's hero banner and other larger
              //    contexts) AND this thumb file (used only by the
              //    grid card) generated with zero manual configuration
              //    — the exact same self-healing guarantee every other
              //    image type in this workflow already has. This block
              //    only runs for type === 'post' — author images are
              //    completely unaffected.
              // ==========================================================
              if (type === 'post') {
                const thumbMaxWidth = 340;
                const thumbOutFile = file.replace(/\.[^.]+$/, '-thumb.webp');
                const thumbOut = join(dir, thumbOutFile);
                const thumbUpToDate = contentChanged
                  ? false
                  : await isUpToDate(input, thumbOut, thumbMaxWidth, false);
                const needsThumbReconvert = contentChanged || !thumbUpToDate;
                if (needsThumbReconvert) {
                  if (existsSync(thumbOut)) {
                    forceVerifySet.add(thumbOut);
                  }
                  const thumbImage = sharp(input);
                  const thumbMetadata = await thumbImage.metadata();
                  let thumbPipeline = thumbImage;
                  if (thumbMetadata.width && thumbMetadata.width > thumbMaxWidth) {
                    thumbPipeline = thumbPipeline.resize({
                      width: thumbMaxWidth,
                      withoutEnlargement: true,
                      kernel: sharp.kernel.lanczos3,
                    });
                  }
                  await thumbPipeline
                    .webp({ quality: 82, smartSubsample: true, effort: 6 })
                    .toFile(thumbOut);
                  console.log(`[POST-THUMB] ${file} (${thumbMetadata.width}x${thumbMetadata.height}) -> ${thumbOutFile}`);
                  processedCount++;
                } else {
                  skippedCount++;
                }
              }
            }
          }
          // ==========================================================
          // 🎯 SLIDER DUAL-OUTPUT PIPELINE — fixes PageSpeed Insights
          //    "Improve image delivery" flag (slide-2.webp: 86.6 KiB
          //    delivered vs ~11.7 KiB needed on mobile). ROOT CAUSE:
          //    FeaturedSlider.astro previously used a single plain
          //    <img src="/images/slider/slide-N.webp"> with NO
          //    responsive srcset/picture element at all — every
          //    device, including small phones, always downloaded the
          //    same full 1200px-wide master file regardless of the
          //    actual rendered slot size.
          //
          //    THE FIX: for every slider source image, this block now
          //    produces TWO output files:
          //      1. "slide-N.webp"        — UNCHANGED filename, same
          //         1200px max width, same quality — used by desktop/
          //         tablet viewports via FeaturedSlider.astro's
          //         <picture><img> fallback. Zero regression: any
          //         existing reference to this exact filename anywhere
          //         in the codebase keeps working identically.
          //      2. "slide-N-mobile.webp" — NEW, lightweight ~700px
          //         max width companion file, referenced by
          //         FeaturedSlider.astro's <source media="(max-width:
          //         767px)"> for phones/small viewports, cutting the
          //         downloaded byte size substantially on exactly the
          //         devices PageSpeed's mobile audit flagged.
          //
          //    CONTENT-HASH GUARD REUSE (critical correctness detail):
          //    hasSourceContentChanged() is called EXACTLY ONCE per
          //    source file here (see the "contentChanged" variable
          //    below) and its boolean result is reused for BOTH the
          //    desktop and mobile output decisions — calling it twice
          //    would falsely report "unchanged" on the second call
          //    (see the function's own doc-comment above for why).
          //
          //    SELF-HEALING: any new slide image dropped into
          //    public/images/slider/ (jpg/jpeg/png) is automatically
          //    picked up by this same loop and gets both variants
          //    generated with zero manual configuration — exactly the
          //    same self-healing guarantee every other image folder in
          //    this workflow already has.
          // ==========================================================
          const sliderDir = 'public/images/slider';
          const sliderDesktopMaxWidth = 1200;
          const sliderMobileMaxWidth = 700;
          if (existsSync(sliderDir)) {
            for (const file of readdirSync(sliderDir)) {
              if (!/\.(jpg|jpeg|png)$/i.test(file)) continue;
              const input = join(sliderDir, file);
              const desktopOutFile = file.replace(/\.[^.]+$/, '.webp');
              const desktopOut = join(sliderDir, desktopOutFile);
              const mobileOutFile = file.replace(/\.[^.]+$/, '-mobile.webp');
              const mobileOut = join(sliderDir, mobileOutFile);
              // Compute the content-change status ONCE, reuse for both
              // outputs below (see rationale in the block comment above).
              const contentChanged = hasSourceContentChanged(input);
              // --- Desktop variant (existing filename/behavior, unchanged) ---
              const desktopUpToDate = contentChanged
                ? false
                : await isUpToDate(input, desktopOut, sliderDesktopMaxWidth, false);
              const needsDesktopReconvert = contentChanged || !desktopUpToDate;
              if (needsDesktopReconvert) {
                if (existsSync(desktopOut)) {
                  forceVerifySet.add(desktopOut);
                }
                const image = sharp(input);
                const metadata = await image.metadata();
                let pipeline = image;
                if (metadata.width && metadata.width > sliderDesktopMaxWidth) {
                  pipeline = pipeline.resize({
                    width: sliderDesktopMaxWidth,
                    withoutEnlargement: true,
                    kernel: sharp.kernel.lanczos3,
                  });
                }
                await pipeline
                  .webp({ quality: 85, smartSubsample: true, effort: 6 })
                  .toFile(desktopOut);
                convertedMap[file] = desktopOutFile;
                processedCount++;
                console.log(`[SLIDER-DESKTOP] ${file} (${metadata.width}x${metadata.height}) -> ${desktopOutFile}`);
              } else {
                skippedCount++;
              }
              // --- Mobile variant (NEW — lightweight ~700w companion) ---
              const mobileUpToDate = contentChanged
                ? false
                : await isUpToDate(input, mobileOut, sliderMobileMaxWidth, false);
              const needsMobileReconvert = contentChanged || !mobileUpToDate;
              if (needsMobileReconvert) {
                if (existsSync(mobileOut)) {
                  forceVerifySet.add(mobileOut);
                }
                const image = sharp(input);
                const metadata = await image.metadata();
                let pipeline = image;
                if (metadata.width && metadata.width > sliderMobileMaxWidth) {
                  pipeline = pipeline.resize({
                    width: sliderMobileMaxWidth,
                    withoutEnlargement: true,
                    kernel: sharp.kernel.lanczos3,
                  });
                }
                await pipeline
                  .webp({ quality: 82, smartSubsample: true, effort: 6 })
                  .toFile(mobileOut);
                processedCount++;
                console.log(`[SLIDER-MOBILE] ${file} (${metadata.width}x${metadata.height}) -> ${mobileOutFile}`);
              } else {
                skippedCount++;
              }
            }
          }
          // ==========================================================
          // 🖼️ ROOT IMAGES SYSTEM — public/images/ ඇතුළේ කෙලින්ම තියෙන
          //    විශේෂ පින්තූර. Crop නොවේ, Ratio ආරක්ෂා වේ. Content-hash
          //    guard එකම apply වේ (universal — app-icon-only special
          //    casing තවත් අවශ්‍ය නොවේ).
          // ==========================================================
          const rootImages = ['Copyright & Credit Policy.png', 'Auhor.png', 'author.png'];
          const rootDir = 'public/images';
          const rootMaxWidth = 850;
          for (const file of rootImages) {
            const input = join(rootDir, file);
            if (!existsSync(input)) continue;
            const outFile = file.replace(/\.[^.]+$/, '.webp');
            const out = join(rootDir, outFile);
            const needsReconvert = await shouldReconvert(input, out, rootMaxWidth, false);
            if (!needsReconvert) {
              skippedCount++;
              continue;
            }
            if (existsSync(out)) {
              forceVerifySet.add(out);
            }
            const image = sharp(input);
            const metadata = await image.metadata();
            let pipeline = image;
            if (metadata.width && metadata.width > rootMaxWidth) {
              pipeline = pipeline.resize({
                width: rootMaxWidth,
                withoutEnlargement: true,
                kernel: sharp.kernel.lanczos3
              });
            }
            await pipeline
              .webp({ quality: 85, smartSubsample: true, effort: 6 })
              .toFile(out);
            convertedMap[file] = outFile;
            processedCount++;
            console.log(`[ROOT IMAGE] ${file} (${metadata.width}x${metadata.height}) -> ${outFile}`);
          }
          // ==========================================================
          // 🔗 LOGO / FAVICON / OG-IMAGE / APP-ICON — universal
          //    content-hash guard now applies identically to ALL FOUR
          //    of these (previously only app-icon had special
          //    "force-verify" treatment; logo/favicon/og-image had
          //    none). convertSingle() reconverts whenever
          //    shouldReconvert() says so (hash-changed OR stale), and
          //    always reports back whether it actually re-ran so the
          //    universal downstream sync knows to double-check every
          //    reference to that image.
          // ==========================================================
          async function convertSingle(inputPath, outputPath, targetWidth, isSquare, resizeOpts, webpOpts, mapKey) {
            if (!existsSync(inputPath)) return false;
            const needsReconvert = await shouldReconvert(inputPath, outputPath, targetWidth, isSquare);
            if (!needsReconvert) {
              skippedCount++;
              return false;
            }
            if (existsSync(outputPath)) {
              forceVerifySet.add(outputPath);
            }
            let pipeline = sharp(inputPath);
            if (resizeOpts) pipeline = pipeline.resize(resizeOpts);
            await pipeline.webp(webpOpts).toFile(outputPath);
            convertedMap[mapKey] = outputPath.split('/').pop();
            processedCount++;
            console.log(`Done: ${mapKey} -> ${convertedMap[mapKey]}`);
            return true;
          }
          await convertSingle(
            'public/images/logo.png',
            'public/images/logo.webp',
            300, false,
            { width: 300, withoutEnlargement: true, kernel: sharp.kernel.lanczos3 },
            { quality: 95, effort: 6 },
            'logo.png'
          );
          await convertSingle(
            'public/images/favicon.png',
            'public/images/favicon.webp',
            32, true,
            { width: 32, height: 32, fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 } },
            { quality: 100, effort: 6 },
            'favicon.png'
          );
          await convertSingle(
            'public/images/og-image.jpg',
            'public/images/og-image.webp',
            1200, false,
            { width: 1200, withoutEnlargement: true, kernel: sharp.kernel.lanczos3 },
            { quality: 85, effort: 6 },
            'og-image.jpg'
          );
          const appIconConverted = await convertSingle(
            'public/images/app-icon.jpg',
            'public/images/app-icon.webp',
            512, true,
            { width: 512, height: 512, fit: 'contain', background: { r: 5, g: 5, b: 5, alpha: 1 } },
            { quality: 95, effort: 6 },
            'app-icon.jpg'
          );
          // ==========================================================
          // 📝 AUTO-UPDATE FRONTMATTER — content/posts/*.md, authors/*.md
          //    ආදිය ඇතුළේ image path string එක .jpg/.png -> .webp
          //    බවට replace කරයි (filename-changed scenario).
          //
          //    🎯 UNIVERSAL FORCE-VERIFY PASS (NEW): forceVerifySet
          //    එකේ ඇති සෑම .webp output path එකක්ම (filename NEVER
          //    changed, but source content did) සඳහා, content
          //    collection files ඇතුළේ ඒ path එකට matching reference
          //    එකක් තියෙනවා දැයි log කරයි — file itself modify කරන්නේ
          //    නෑ (path string එකේ අකුරු කිසිවක් වෙනස් වී නැති නිසා
          //    replace කිරීමට කිසිවක් නෑ), ඒත් build cache/CDN cache
          //    layer එකට "මේ file එක fresh content එකක් අඩංගුයි"
          //    කියලා log-level confirmation එකක් සපයයි, සහ
          //    Cloudflare/browser cache-busting අවශ්‍ය දැයි (mtime
          //    already updated by Sharp's toFile() write) confirm කරයි.
          // ==========================================================
          function updateFrontmatterInDir(dir) {
            if (!existsSync(dir)) return;
            for (const file of readdirSync(dir)) {
              if (!/\.(md|mdx)$/i.test(file)) continue;
              const filePath = join(dir, file);
              let content = readFileSync(filePath, 'utf-8');
              let changed = false;
              // 1. Filename-changed replacements (existing behavior)
              for (const [oldName, newName] of Object.entries(convertedMap)) {
                const regex = new RegExp(oldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                if (regex.test(content)) {
                  content = content.replace(regex, newName);
                  changed = true;
                }
              }
              // 2. 🎯 Universal force-verify confirmation (filename
              //    unchanged, content refreshed) — no text replacement
              //    needed since the path string is already correct,
              //    but we confirm + log that this file's image
              //    reference already points at the freshly-updated
              //    asset, guaranteeing the live site serves the new
              //    image the moment the CDN/build picks up the new
              //    file bytes at the same path.
              for (const forcedPath of forceVerifySet) {
                const forcedBaseName = basename(forcedPath);
                if (content.includes(forcedBaseName)) {
                  console.log(`Force-verified (content refreshed, path unchanged): ${filePath} -> ${forcedBaseName}`);
                }
              }
              if (changed) {
                writeFileSync(filePath, content, 'utf-8');
                console.log(`Frontmatter updated: ${filePath}`);
              }
            }
          }
          updateFrontmatterInDir('src/content/posts');
          updateFrontmatterInDir('src/content/authors');
          updateFrontmatterInDir('src/content/about');
          updateFrontmatterInDir('src/content/contact');
          updateFrontmatterInDir('src/content/pages');
          // config.json ඇතුළේ logo/favicon/app-icon paths update කිරීම
          const configPath = 'src/config/config.json';
          if (existsSync(configPath)) {
            let configContent = readFileSync(configPath, 'utf-8');
            let configChanged = false;
            for (const [oldName, newName] of Object.entries(convertedMap)) {
              const regex = new RegExp(oldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
              if (regex.test(configContent)) {
                configContent = configContent.replace(regex, newName);
                configChanged = true;
              }
            }
            // 🎯 Universal force-verify confirmation for config.json too
            // (logo.webp / favicon.webp / og-image.webp referenced here)
            for (const forcedPath of forceVerifySet) {
              const forcedBaseName = basename(forcedPath);
              if (configContent.includes(forcedBaseName)) {
                console.log(`Force-verified (content refreshed, path unchanged): ${configPath} -> ${forcedBaseName}`);
              }
            }
            if (configChanged) {
              writeFileSync(configPath, configContent, 'utf-8');
              console.log('Frontmatter updated: src/config/config.json');
            }
          }
          // ==========================================================
          // 📝 AUTO-UPDATE public/manifest.json — now uses the SAME
          //    universal forceVerifySet mechanism as every other asset
          //    (previously this was the ONLY place with a hand-rolled
          //    "appIconConverted" special case; that special case is
          //    now fully superseded by the universal hash-based guard
          //    above, but is harmlessly kept as an extra safety
          //    signal via forceVerifySet.has(...) below).
          // ==========================================================
          const manifestPath = 'public/manifest.json';
          if (existsSync(manifestPath)) {
            let manifestContent = readFileSync(manifestPath, 'utf-8');
            let manifestChanged = false;
            for (const [oldName, newName] of Object.entries(convertedMap)) {
              const regex = new RegExp(oldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
              if (regex.test(manifestContent)) {
                manifestContent = manifestContent.replace(regex, newName);
                manifestChanged = true;
              }
            }
            const appIconWebpPath = join(rootDir, 'app-icon.webp');
            const appIconExists = existsSync(appIconWebpPath);
            const missingAppIconRef = appIconExists && !manifestContent.includes('app-icon.webp');
            const needsForceVerify = appIconExists && (appIconConverted || forceVerifySet.has(appIconWebpPath));
            if (missingAppIconRef || needsForceVerify) {
              try {
                const manifestJson = JSON.parse(manifestContent);
                if (Array.isArray(manifestJson.icons)) {
                  let iconsFixed = false;
                  manifestJson.icons = manifestJson.icons.map((icon) => {
                    if (icon.src !== '/images/app-icon.webp' || icon.type !== 'image/webp') {
                      iconsFixed = true;
                      return { ...icon, src: '/images/app-icon.webp', type: 'image/webp' };
                    }
                    return icon;
                  });
                  if (iconsFixed || missingAppIconRef) {
                    manifestContent = JSON.stringify(manifestJson, null, 2) + '\n';
                    manifestChanged = true;
                    console.log(
                      missingAppIconRef
                        ? 'manifest.json icons[].src force-injected -> /images/app-icon.webp'
                        : 'manifest.json icons[] re-verified against freshly re-converted app-icon.webp'
                    );
                  }
                }
              } catch (err) {
                console.error('manifest.json parse error — skipping app-icon guard:', err.message);
              }
            }
            if (manifestChanged) {
              writeFileSync(manifestPath, manifestContent, 'utf-8');
              console.log('Frontmatter updated: public/manifest.json');
            }
          }
          console.log('--- Conversion Summary ---');
          console.log(`Processed: ${processedCount}, Skipped (already up-to-date): ${skippedCount}`);
          console.log(`Force-verified (content refreshed, filename unchanged): ${forceVerifySet.size}`);
          console.log(JSON.stringify(convertedMap, null, 2));
          EOF
      - name: Commit optimized images + hash sidecars + updated frontmatter
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/images/*.webp || true
          git add public/images/authors/*.webp || true
          git add public/images/slider/*.webp || true
          git add public/images/posts/*.webp || true
          git add public/images/logo.webp || true
          git add public/images/favicon.webp || true
          git add public/images/og-image.webp || true
          git add public/images/app-icon.webp || true
          # 🎯 NEW: commit the .hash sidecar files (tiny text files that
          # power the universal content-change detection above). These
          # live alongside their source images and must be tracked so
          # the NEXT workflow run can compare against them.
          git add public/images/*.hash || true
          git add public/images/authors/*.hash || true
          git add public/images/slider/*.hash || true
          git add public/images/posts/*.hash || true
          git add public/manifest.json || true
          git add src/content/posts/*.md || true
          git add src/content/authors/*.md || true
          git add src/content/about/*.md || true
          git add src/content/contact/*.md || true
          git add src/content/pages/*.md || true
          git add src/config/config.json || true
          git diff --staged --quiet || git commit -m "Auto: Slider mobile-optimized WebP variants (PageSpeed 'Improve image delivery' fix) + post grid-thumbnail dual-output + universal content-hash guard + frontmatter/config/manifest sync"
          git push
