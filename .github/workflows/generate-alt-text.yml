name: Auto-Generate Image Alt Text (AI, PR-Based)
on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"
      - "public/images/posts/**"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  generate-alt-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity
        run: |
          git config user.name "wal-katha-alttext-bot"
          git config user.email "alttext-bot@users.noreply.github.com"
      - name: Create working branch
        id: branch
        run: |
          BRANCH="autofix/image-alt-text-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Install helper packages in isolated temp folder
        run: |
          mkdir -p /tmp/alttext-tool
          cd /tmp/alttext-tool
          npm init -y
          npm install gray-matter@4
      - name: Generate alt text via Gemini Vision API
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module << 'EOF'
          import { createRequire } from 'module';
          import { readFileSync, writeFileSync, readdirSync, existsSync, appendFileSync } from 'fs';
          import { join } from 'path';
          const require = createRequire('/tmp/alttext-tool/package.json');
          const matter = require('gray-matter');
          const POSTS_DIR = 'src/content/posts';
          const PUBLIC_DIR = 'public';
          const MAX_PER_RUN = 5;
          const GEMINI_MODEL_PRIMARY = 'gemini-3.6-flash';
          const GEMINI_MODEL_FALLBACKS = ['gemini-2.5-flash', 'gemini-flash-latest'];
          const SITE_BRAND = 'Wal Katha';
          // Google Image Search LSI/secondary keyword cluster - one is
          // picked deterministically per post (based on filename hash,
          // not random per-run) so the same post always gets the same
          // secondary keyword assigned across retries, avoiding
          // inconsistent SEO signals if a run is re-triggered.
          const SEO_KEYWORD_CLUSTER = [
            'sinhala wal katha',
            'aluth wal katha',
            'wal katha 2026',
            'wal katha story',
            'wala katha collection',
          ];
          const apiKey = process.env.GEMINI_API_KEY;
          if (!apiKey) {
            console.error('========================================');
            console.error('DIAGNOSTIC: GEMINI_API_KEY secret is NOT SET.');
            console.error('Go to: Settings > Secrets and variables > Actions');
            console.error('and add a repository secret named GEMINI_API_KEY.');
            console.error('Skipping alt-text generation for this run.');
            console.error('========================================');
            appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes=false\n');
            process.exit(0);
          }
          console.log('DIAGNOSTIC: GEMINI_API_KEY secret detected (length: ' + apiKey.length + ' chars).');
          function humanizeSlug(value) {
            if (!value) return '';
            return String(value)
              .replace(/[-_]+/g, ' ')
              .trim()
              .replace(/\s+/g, ' ')
              .replace(/^[a-z]/, (m) => m.toUpperCase());
          }
          function pickSecondaryKeyword(seedString) {
            let hash = 0;
            for (let i = 0; i < seedString.length; i++) {
              hash = (hash * 31 + seedString.charCodeAt(i)) >>> 0;
            }
            return SEO_KEYWORD_CLUSTER[hash % SEO_KEYWORD_CLUSTER.length];
          }
          const files = readdirSync(POSTS_DIR).filter((f) => /\.(md|mdx)$/i.test(f) && !f.startsWith('-'));
          console.log(`DIAGNOSTIC: Scanned ${files.length} post file(s) in ${POSTS_DIR}.`);
          const candidates = [];
          const skippedReasons = [];
          for (const file of files) {
            const filePath = join(POSTS_DIR, file);
            const raw = readFileSync(filePath, 'utf-8');
            const parsed = matter(raw);
            const fm = parsed.data || {};
            if (!fm.image) {
              skippedReasons.push(`${file}: SKIPPED - no "image" field in frontmatter.`);
              continue;
            }
            if (fm.image_alt) {
              skippedReasons.push(`${file}: SKIPPED - "image_alt" already set.`);
              continue;
            }
            const imgRelPath = String(fm.image).replace(/^\/+/, '');
            const imgAbsPath = join(PUBLIC_DIR, imgRelPath);
            if (!existsSync(imgAbsPath)) {
              skippedReasons.push(`${file}: SKIPPED - image file NOT FOUND at "${imgAbsPath}".`);
              continue;
            }
            const category = Array.isArray(fm.categories) && fm.categories.length > 0
              ? humanizeSlug(fm.categories[0])
              : '';
            candidates.push({
              file: filePath,
              title: fm.title || file,
              category,
              imgAbsPath,
              secondaryKeyword: pickSecondaryKeyword(file),
            });
          }
          console.log('DIAGNOSTIC: --- Skip reasons for every non-candidate post ---');
          if (skippedReasons.length > 0) {
            skippedReasons.forEach((r) => console.log('  ' + r));
          } else {
            console.log('  (no posts were skipped)');
          }
          console.log('DIAGNOSTIC: -----------------------------------------------');
          const selected = candidates.slice(0, MAX_PER_RUN);
          console.log(`Found ${candidates.length} post(s) missing image_alt - processing ${selected.length} this run.`);
          if (selected.length === 0) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes=false\n');
            process.exit(0);
          }
          function mimeFromExt(p) {
            const ext = p.split('.').pop().toLowerCase();
            if (ext === 'webp') return 'image/webp';
            if (ext === 'png') return 'image/png';
            if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
            return 'image/webp';
          }
          function buildPrompt(postTitle, category, secondaryKeyword) {
            const categoryLine = category
              ? `The post's category is: "${category}". `
              : '';
            return (
              `You are an expert Image SEO Specialist for Google Image Search, ` +
              `targeting the primary brand query "${SITE_BRAND}" (Sinhala Wal Katha) ` +
              'on a Sinhala creative-fiction storytelling website. ' +
              'Analyze this image and write ONE highly descriptive, natural Sinhala ' +
              'alt text under 120 characters. Requirements: ' +
              `1. Naturally include "${SITE_BRAND}" or "Sinhala Wal Katha" near the ` +
              'beginning of the text, EXACTLY ONCE. ' +
              `2. If natural, also weave in this secondary search term ONCE: ` +
              `"${secondaryKeyword}". ` +
              categoryLine +
              `3. Include context from the post title ("${postTitle}") without ` +
              'quoting it verbatim. ' +
              '4. Describe visible colors, mood, setting, and objects clearly and ' +
              'tastefully - never explicit/adult details. ' +
              '5. Never repeat any keyword more than once, never write a ' +
              'comma-separated keyword list, never use quotes or markdown. ' +
              'Return ONLY the raw Sinhala alt text string, nothing else.'
            );
          }
          async function callGeminiModel(modelName, base64Data, mimeType, prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            const body = {
              contents: [
                {
                  parts: [
                    { text: prompt },
                    { inline_data: { mime_type: mimeType, data: base64Data } },
                  ],
                },
              ],
            };
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              const errText = await res.text().catch(() => '');
              const err = new Error(`Gemini API error ${res.status}: ${errText}`);
              err.status = res.status;
              throw err;
            }
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Empty response from Gemini API');
            return text.trim().replace(/^["']|["']$/g, '').slice(0, 160);
          }
          async function generateAltText(imgPath, postTitle, category, secondaryKeyword) {
            const imgBuffer = readFileSync(imgPath);
            const base64Data = imgBuffer.toString('base64');
            const mimeType = mimeFromExt(imgPath);
            const prompt = buildPrompt(postTitle, category, secondaryKeyword);
            const modelsToTry = [GEMINI_MODEL_PRIMARY, ...GEMINI_MODEL_FALLBACKS];
            let lastError = null;
            for (const modelName of modelsToTry) {
              try {
                const result = await callGeminiModel(modelName, base64Data, mimeType, prompt);
                if (modelName !== GEMINI_MODEL_PRIMARY) {
                  console.warn(`NOTE: primary model "${GEMINI_MODEL_PRIMARY}" failed, succeeded using fallback model "${modelName}".`);
                }
                return result;
              } catch (err) {
                lastError = err;
                if (err.status === 404 || err.status === 503) {
                  console.warn(`Model "${modelName}" unavailable (${err.status}) - trying next fallback if any.`);
                  continue;
                }
                throw err;
              }
            }
            throw lastError || new Error('All Gemini model attempts failed.');
          }
          function upsertImageAltField(raw, altText) {
            const safeAlt = altText.replace(/"/g, "'");
            const altLine = `image_alt: "${safeAlt}"`;
            const fmMatch = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!fmMatch) return null;
            let fmBlock = fmMatch[1];
            if (/^image_alt:\s*.*$/m.test(fmBlock)) {
              fmBlock = fmBlock.replace(/^image_alt:\s*.*$/m, altLine);
            } else if (/^image:\s*.*$/m.test(fmBlock)) {
              fmBlock = fmBlock.replace(/^(image:\s*.*)$/m, `$1\n${altLine}`);
            } else {
              fmBlock = `${fmBlock}\n${altLine}`;
            }
            return raw.replace(/^---\r?\n[\s\S]*?\r?\n---/, `---\n${fmBlock}\n---`);
          }
          const touched = [];
          for (const item of selected) {
            try {
              const altText = await generateAltText(item.imgAbsPath, item.title, item.category, item.secondaryKeyword);
              const original = readFileSync(item.file, 'utf-8');
              const updatedRaw = upsertImageAltField(original, altText);
              if (!updatedRaw) {
                console.warn(`SELF-TEST FAILED (no frontmatter block): ${item.file} - skipped.`);
                continue;
              }
              const reparsed = matter(updatedRaw);
              if (!reparsed.data.image_alt || !reparsed.data.title) {
                console.warn(`SELF-TEST FAILED (integrity check): ${item.file} - skipped.`);
                continue;
              }
              writeFileSync(item.file, updatedRaw, 'utf-8');
              touched.push({ file: item.file, title: item.title, alt: altText });
              console.log(`Generated alt text for ${item.file}: "${altText}"`);
            } catch (err) {
              console.warn(`Skipped ${item.file}: ${err.message}`);
            }
          }
          writeFileSync('/tmp/alttext-summary.json', JSON.stringify(touched, null, 2));
          appendFileSync(process.env.GITHUB_OUTPUT, `has_changes=${touched.length > 0 ? 'true' : 'false'}\n`);
          EOF
      - name: Verify build integrity before commit
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          corepack enable
          yarn install
          yarn build
      - name: Commit generated alt text
        id: commit
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          git add src/content/posts/*.md || true
          if [ -n "$(find src/content/posts -maxdepth 1 -name '*.mdx' 2>/dev/null)" ]; then
            git add src/content/posts/*.mdx || true
          fi
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto: AI-generated SEO image alt text for posts (Gemini Vision)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push branch
        if: steps.commit.outputs.has_changes == 'true'
        run: git push origin "${{ steps.branch.outputs.branch_name }}"
      - name: Open Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('/tmp/alttext-summary.json')
              ? JSON.parse(fs.readFileSync('/tmp/alttext-summary.json', 'utf8'))
              : [];
            const rows = summary
              .map((s) => `- **${s.title}** (\`${s.file}\`)\n  Alt: _${s.alt}_`)
              .join('\n');
            const body = [
              '## 🤖 AI-Generated SEO Image Alt Text (Gemini Vision)',
              '',
              '"Wal Katha" brand keyword + LSI secondary keyword cluster එකකින් keyword එකක් + category natural ලෙස embed කරගත් SEO alt text PR එකකි.',
              '',
              '### ✅ Merge කරන්න කලින් check කරන්න:',
              '- [x] `yarn build` සාර්ථකව සම්පූර්ණ විය.',
              '- [ ] Alt text descriptions manually review කරන්න.',
              '',
              '### 📝 Generated Alt Text:',
              rows || '(none)',
              '',
              '_මෙම PR එක ස්වයංක්‍රීයව scan-and-propose කරන bot එකකින් සාදන ලදී._',
            ].join('\n');
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto: AI-generated SEO image alt text',
              head: process.env.BRANCH_NAME,
              base: 'main',
              body,
            });
      - name: No changes detected
        if: steps.generate.outputs.has_changes != 'true'
        run: echo "No posts needed alt-text generation this run."
