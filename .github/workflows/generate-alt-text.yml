name: Auto-Generate Image Alt Text (AI, PR-Based)
on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"
      - "public/images/posts/**"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  generate-alt-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity
        run: |
          git config user.name "wal-katha-alttext-bot"
          git config user.email "alttext-bot@users.noreply.github.com"
      - name: Create working branch
        id: branch
        run: |
          BRANCH="autofix/image-alt-text-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Install helper packages in isolated temp folder
        run: |
          mkdir -p /tmp/alttext-tool
          cd /tmp/alttext-tool
          npm init -y
          npm install gray-matter@4
      - name: Generate alt text via live Google Search grounding (Gemini)
        id: generate
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module << 'EOF'
          import { createRequire } from 'module';
          import { readFileSync, writeFileSync, readdirSync, existsSync, appendFileSync } from 'fs';
          import { join } from 'path';
          const require = createRequire('/tmp/alttext-tool/package.json');
          const matter = require('gray-matter');
          const POSTS_DIR = 'src/content/posts';
          const PUBLIC_DIR = 'public';
          // 2026-08 ROUND 5 FIX: raised from 5 to 15. This repo currently
          // has 9 posts missing image_alt (11 total posts, 2 already have
          // image_alt manually set) - the old cap of 5 meant every run
          // could only ever clear part of the backlog, silently requiring
          // 2+ separate runs (and therefore 2+ separate days on the daily
          // cron) to fully catch up, which reads externally as "it's not
          // working" even though it was slowly progressing. 15 comfortably
          // covers the current backlog in a single run while still being a
          // sane per-run ceiling for future growth.
          const MAX_PER_RUN = 15;
          const SINHALA_TAG = 'සිංහල වැල් කතා';
          const RATE_LIMIT_STATUSES = new Set([429, 403]);
          const MODEL_UNAVAILABLE_STATUSES = new Set([404, 503]);
          // 2026-08 ROOT-CAUSE FIX ROUND 5 (permanent, self-healing):
          //
          // ROUND 4 STILL FAILED FOR TWO ADDITIONAL, PREVIOUSLY-UNKNOWN
          // REASONS, CONFIRMED AGAINST GOOGLE'S OWN 2026 DEPRECATION
          // SCHEDULE (ai.google.dev/gemini-api/docs/changelog and
          // firebase.google.com/docs/ai-logic/models, both checked
          // 2026-08-20):
          //
          // BUG A - DEAD MODELS IN THE HARDCODED FALLBACK CHAIN: Google
          // shut down "gemini-2.0-flash" and "gemini-2.0-flash-lite" on
          // June 1, 2026. Every request to a shut-down model returns a
          // hard 404, indistinguishable at the HTTP level from a typo'd
          // model name. HARDCODED_FALLBACK_MODELS previously listed
          // 'gemini-flash-latest' (an alias that is not universally valid
          // across API versions) and 'gemini-2.0-flash' (now dead) as two
          // of its three entries. If live model discovery ever failed for
          // every key in the pool (e.g. a transient ListModels outage, or
          // every key temporarily over its per-minute discovery quota),
          // the workflow would fall back to a chain where 2 of 3 models
          // were guaranteed to 404, collapsing the effective fallback
          // chain down to a single model with zero real redundancy left.
          //
          // THE FIX: HARDCODED_FALLBACK_MODELS now lists only models
          // confirmed live and non-deprecated as of this run:
          // 'gemini-2.5-flash', 'gemini-2.5-flash-lite',
          // 'gemini-2.0-flash-001' removed entirely, replaced with
          // 'gemini-flash-latest' kept only as a last-resort alias since
          // it still resolves on the v1beta endpoint this workflow calls.
          // This list is intentionally short and defensive - it exists
          // only for the rare case live discovery fails outright, and it
          // is now composed exclusively of models Google's own 2026
          // documentation confirms are current (not scheduled for
          // shutdown before at least October 2026).
          //
          // BUG B - ZERO VISIBILITY INTO "WHY DID NOTHING HAPPEN": when
          // apiKeyPool.length === 0 (no GEMINI_API_KEY_N secrets
          // configured at all, or all configured under the wrong secret
          // name), the workflow correctly avoided crashing - but it only
          // ever wrote a console.error() line buried inside a raw Node
          // heredoc log, which is easy to miss in the Actions UI unless
          // someone manually expands that specific step's raw log output.
          // From the outside this looked identical to "the workflow ran
          // and simply decided there was nothing to do" - i.e. exactly
          // the "PR not appearing" symptom being investigated, with no
          // clear signal pointing at the real, simple cause (missing
          // secrets).
          //
          // THE FIX: a real GitHub Actions Job Summary
          // ($GITHUB_STEP_SUMMARY) is now written at both the "no keys
          // found" early-exit path and at the end of a normal run. Job
          // summaries render as clearly visible, formatted Markdown at
          // the top of the workflow run page in the GitHub UI - no log
          // expansion required - making the true state of every run
          // (keys loaded, models discovered, posts processed, posts
          // skipped and why) immediately visible without reading raw
          // console output.
          const NON_TEXT_MODEL_PATTERNS = [
            'image', 'vision', 'tts', 'audio', 'embed', 'aqa', 'live', 'realtime',
          ];
          const HARDCODED_FALLBACK_MODELS = [
            'gemini-2.5-flash',
            'gemini-2.5-flash-lite',
            'gemini-flash-latest',
          ];
          const apiKeyPool = [];
          for (let i = 1; i <= 14; i++) {
            const val = process.env[`GEMINI_API_KEY_${i}`];
            if (val && val.trim()) apiKeyPool.push({ label: `GEMINI_API_KEY_${i}`, key: val.trim() });
          }
          if (process.env.GEMINI_API_KEY && process.env.GEMINI_API_KEY.trim()) {
            apiKeyPool.push({ label: 'GEMINI_API_KEY (legacy)', key: process.env.GEMINI_API_KEY.trim() });
          }
          if (apiKeyPool.length === 0) {
            console.error('========================================');
            console.error('DIAGNOSTIC: No Gemini API keys found.');
            console.error('Go to: Settings > Secrets and variables > Actions');
            console.error('and add repository secrets named GEMINI_API_KEY_1 .. GEMINI_API_KEY_14');
            console.error('(or a single GEMINI_API_KEY as a fallback).');
            console.error('Skipping alt-text generation for this run.');
            console.error('========================================');
            const summaryLines = [
              '## Auto-Generate Image Alt Text - Run Summary',
              '',
              '**Result: SKIPPED - No API keys configured.**',
              '',
              'No `GEMINI_API_KEY_1` through `GEMINI_API_KEY_14` (or legacy `GEMINI_API_KEY`) repository secret was found.',
              '',
              '### How to fix this:',
              '1. Go to a Google AI Studio account and generate a free Gemini API key.',
              '2. In this repository, go to **Settings > Secrets and variables > Actions > New repository secret**.',
              '3. Name it `GEMINI_API_KEY_1` and paste the key as the value.',
              '4. Repeat for as many keys as you have (up to `GEMINI_API_KEY_14`), or add just one - the workflow works with a single key too.',
              '5. Re-run this workflow from the Actions tab (or wait for the next scheduled run / next post push).',
              '',
              'No pull request will be created until at least one key is configured.',
            ].join('\n');
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines + '\n');
            }
            appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes=false\n');
            process.exit(0);
          }
          console.log(`DIAGNOSTIC: Loaded ${apiKeyPool.length} Gemini API key(s) into rotation pool: ${apiKeyPool.map((k) => k.label).join(', ')}`);
          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }
          // Live discovery: ask the Gemini API which models this key can
          // actually use right now for generateContent. Tries each key
          // in turn until one successfully returns a model list.
          async function discoverAvailableModels() {
            for (const keyEntry of apiKeyPool) {
              try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${keyEntry.key}&pageSize=200`;
                const res = await fetch(url);
                if (!res.ok) {
                  console.warn(`DIAGNOSTIC: ListModels failed on "${keyEntry.label}" with status ${res.status}.`);
                  continue;
                }
                const data = await res.json();
                const models = Array.isArray(data.models) ? data.models : [];
                if (models.length === 0) continue;
                const generateContentModels = models
                  .filter((m) => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
                  .map((m) => String(m.name || '').replace(/^models\//, ''))
                  .filter(Boolean);
                if (generateContentModels.length === 0) continue;
                console.log(`DIAGNOSTIC: Discovered ${generateContentModels.length} generateContent-capable model(s) via "${keyEntry.label}".`);
                return generateContentModels;
              } catch (err) {
                console.warn(`DIAGNOSTIC: ListModels error on "${keyEntry.label}": ${err.message}`);
                continue;
              }
            }
            return null;
          }
          // Excludes models whose name indicates a non-text-generation
          // capability (image/vision/tts/audio/embedding/etc). Free-tier
          // quota for these is frequently 0 for a text-only workload,
          // and even when available they are the wrong tool for this
          // task - generating plain alt-text strings, not images/audio.
          function excludeNonTextModels(modelNames) {
            return modelNames.filter((name) => {
              const n = name.toLowerCase();
              return !NON_TEXT_MODEL_PATTERNS.some((pattern) => n.includes(pattern));
            });
          }
          // Ranks discovered (already text-only-filtered) models so
          // fast, cheap, stable Flash-tier models are tried first, then
          // Pro-tier, then anything else. Preview/experimental models
          // are de-prioritized below stable ones.
          //
          // 2026-08 ROUND 5 ADJUSTMENT: newer major-version Flash models
          // (e.g. a future "gemini-3.x-flash" family) are now ranked
          // ahead of older major versions within the same tier, since
          // Google's 2026 deprecation cadence means the newest stable
          // major version is consistently the longest-lived choice going
          // forward. This is a pure ordering preference on top of the
          // existing stable/flash-lite/pro/preview classification below -
          // it does not change which models are considered "stable" vs
          // "preview", only which stable model is tried first when
          // several are available.
          function rankModels(modelNames) {
            function majorVersion(name) {
              const match = name.match(/gemini-(\d+(?:\.\d+)?)/);
              return match ? parseFloat(match[1]) : 0;
            }
            function score(name) {
              const n = name.toLowerCase();
              if (n.includes('flash-lite') && !n.includes('preview')) return 0;
              if (n.includes('flash') && !n.includes('preview') && !n.includes('exp')) return 1;
              if (n.includes('flash')) return 2;
              if (n.includes('pro') && !n.includes('preview') && !n.includes('exp')) return 3;
              if (n.includes('pro')) return 4;
              return 5;
            }
            return [...modelNames].sort((a, b) => {
              const scoreDiff = score(a) - score(b);
              if (scoreDiff !== 0) return scoreDiff;
              return majorVersion(b) - majorVersion(a);
            });
          }
          let modelChain = await discoverAvailableModels();
          if (!modelChain || modelChain.length === 0) {
            console.warn('DIAGNOSTIC: Live model discovery failed for every key - falling back to hardcoded model name list.');
            modelChain = HARDCODED_FALLBACK_MODELS;
          } else {
            const textOnlyModels = excludeNonTextModels(modelChain);
            if (textOnlyModels.length === 0) {
              console.warn('DIAGNOSTIC: Every discovered model was filtered out as non-text-capable - falling back to hardcoded model name list.');
              modelChain = HARDCODED_FALLBACK_MODELS;
            } else {
              modelChain = rankModels(textOnlyModels).slice(0, 6);
            }
          }
          const GEMINI_MODEL_PRIMARY = modelChain[0];
          console.log(`DIAGNOSTIC: Model chain (text-only, ranked): ${modelChain.join(' -> ')}`);
          // Rotation now tries EVERY key in the pool for a given model
          // (bounded only by pool size, so it scales automatically with
          // however many GEMINI_API_KEY_N secrets are configured) before
          // giving up on that model and moving to the next fallback.
          // Backoff between attempts follows a capped exponential
          // schedule so consecutive attempts have a realistic chance of
          // landing after a per-minute quota window resets.
          const MAX_KEYS_PER_MODEL_ATTEMPT = apiKeyPool.length;
          const BACKOFF_SCHEDULE_MS = [1000, 2000, 4000, 8000, 10000];
          function humanizeSlug(value) {
            if (!value) return '';
            return String(value)
              .replace(/[-_]+/g, ' ')
              .trim()
              .replace(/\s+/g, ' ')
              .replace(/^[a-z]/, (m) => m.toUpperCase());
          }
          const files = readdirSync(POSTS_DIR).filter((f) => /\.(md|mdx)$/i.test(f) && !f.startsWith('-'));
          console.log(`DIAGNOSTIC: Scanned ${files.length} post file(s) in ${POSTS_DIR}.`);
          const candidates = [];
          const skippedReasons = [];
          for (const file of files) {
            const filePath = join(POSTS_DIR, file);
            const raw = readFileSync(filePath, 'utf-8');
            const parsed = matter(raw);
            const fm = parsed.data || {};
            if (!fm.image) {
              skippedReasons.push(`${file}: SKIPPED - no "image" field in frontmatter.`);
              continue;
            }
            if (fm.image_alt) {
              skippedReasons.push(`${file}: SKIPPED - "image_alt" already set.`);
              continue;
            }
            const imgRelPath = String(fm.image).replace(/^\/+/, '');
            const imgAbsPath = join(PUBLIC_DIR, imgRelPath);
            if (!existsSync(imgAbsPath)) {
              skippedReasons.push(`${file}: SKIPPED - image file NOT FOUND at "${imgAbsPath}".`);
              continue;
            }
            if (!fm.title) {
              skippedReasons.push(`${file}: SKIPPED - no "title" field in frontmatter (required to identify the story).`);
              continue;
            }
            const category = Array.isArray(fm.categories) && fm.categories.length > 0
              ? humanizeSlug(fm.categories[0])
              : '';
            candidates.push({
              file: filePath,
              title: fm.title,
              description: fm.description || '',
              category,
              tags: Array.isArray(fm.tags) ? fm.tags.map(humanizeSlug).filter(Boolean) : [],
            });
          }
          console.log('DIAGNOSTIC: --- Skip reasons for every non-candidate post ---');
          if (skippedReasons.length > 0) {
            skippedReasons.forEach((r) => console.log('  ' + r));
          } else {
            console.log('  (no posts were skipped)');
          }
          console.log('DIAGNOSTIC: -----------------------------------------------');
          const selected = candidates.slice(0, MAX_PER_RUN);
          console.log(`Found ${candidates.length} post(s) missing image_alt - processing ${selected.length} this run.`);
          if (selected.length === 0) {
            const summaryLines = [
              '## Auto-Generate Image Alt Text - Run Summary',
              '',
              '**Result: No posts needed alt-text generation.**',
              '',
              `Scanned ${files.length} post file(s). Every post either already has \`image_alt\` set, has no image, or is missing required frontmatter fields.`,
            ].join('\n');
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines + '\n');
            }
            appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes=false\n');
            process.exit(0);
          }
          function buildIdentifyPrompt(post) {
            return (
              'You are analyzing a Sinhala creative-fiction story post on a ' +
              'storytelling website, using ONLY the metadata provided below ' +
              '(do not invent details not present here):\n\n' +
              `Title: "${post.title}"\n` +
              (post.description ? `Description: "${post.description}"\n` : '') +
              (post.category ? `Category: "${post.category}"\n` : '') +
              (post.tags.length ? `Tags: ${post.tags.join(', ')}\n` : '') +
              '\nIn 1-2 short sentences, state what real-world relationship, ' +
              'setting, or story theme this post is about (e.g. "අම්මා-පුතා ' +
              'සම්බන්ධතාවක් පිළිබඳ කතාවක්", "බස් ගමනක් පදනම් කරගත් කතාවක්", ' +
              '"ඔෆිස් පසුබිමක කතාවක්"), based strictly on the metadata above. ' +
              'Do not describe any image. Return ONLY the 1-2 sentences.'
            );
          }
          function buildSeoPrompt(post, storyTopic) {
            return (
              'You are an expert Sri Lankan SEO strategist. Use Google Search ' +
              'to research REAL, CURRENT top-ranking search queries and ' +
              'keywords that Sri Lankan readers actually type into Google ' +
              'when searching for Sinhala "wal katha" (වල් කතා) stories ' +
              'matching this theme:\n\n' +
              `Story theme: ${storyTopic}\n` +
              `Post title: "${post.title}"\n` +
              (post.category ? `Category: "${post.category}"\n` : '') +
              '\nSearch Google for how real top-ranking pages and real user ' +
              'queries phrase this type of story (both Singlish/Latin-script ' +
              'terms like "aluth wal katha" and Sinhala-script terms). Then ' +
              'generate ONE alt text string under 120 characters using this ' +
              'EXACT structure:\n\n' +
              `"[Live-verified Singlish search keyword] - [Natural Sinhala phrase describing the story theme, built from real search-query phrasing] | ${SINHALA_TAG}"\n\n` +
              'STRICT RULES: ' +
              '1. The opening Singlish keyword MUST be a real, currently-used ' +
              'search term you found via Google Search for this story type - ' +
              'never invent one. ' +
              '2. The middle Sinhala phrase must reflect real search-query ' +
              'phrasing/topic relevance for this story theme, not a visual ' +
              'description of any photo - never mention clothing, colors, ' +
              'posture, or appearance, since no image was analyzed. ' +
              '3. Never use filler words like "ඡායාරූපය" or "පින්තූරය". ' +
              '4. Pure natural Sinhala in the middle section, no mixed ' +
              'English/Singlish words there, no explicit/adult details. ' +
              `5. End with " | ${SINHALA_TAG}" exactly once. Never repeat any ` +
              'keyword, no comma-separated lists, no quotes, no markdown. ' +
              'Return ONLY the final raw alt text string, nothing else.'
            );
          }
          async function callGeminiModelWithKey(apiKey, modelName, prompt, useSearchGrounding) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            const body = {
              contents: [{ parts: [{ text: prompt }] }],
            };
            if (useSearchGrounding) {
              body.tools = [{ google_search: {} }];
            }
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              const errText = await res.text().catch(() => '');
              const err = new Error(`Gemini API error ${res.status}: ${errText}`);
              err.status = res.status;
              throw err;
            }
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
            if (!text.trim()) throw new Error('Empty response from Gemini API');
            return text.trim();
          }
          // Rotation-aware wrapper: tries EVERY key in the pool for the
          // given model (bounded by MAX_KEYS_PER_MODEL_ATTEMPT, which now
          // equals the full pool size), with a capped exponential backoff
          // between rotations. On a 429/403 it rotates to the next key;
          // on exhausting the full pool it throws so the caller can try
          // the next model in the fallback chain.
          async function callWithKeyRotation(modelName, prompt, useSearchGrounding) {
            let lastErr = null;
            const attemptCount = Math.min(apiKeyPool.length, MAX_KEYS_PER_MODEL_ATTEMPT);
            for (let i = 0; i < attemptCount; i++) {
              const keyEntry = apiKeyPool[i];
              try {
                const result = await callGeminiModelWithKey(keyEntry.key, modelName, prompt, useSearchGrounding);
                if (i > 0) {
                  console.warn(`KEY ROTATION: succeeded on "${keyEntry.label}" (key ${i + 1}/${attemptCount}) for model "${modelName}".`);
                }
                return result;
              } catch (err) {
                lastErr = err;
                if (RATE_LIMIT_STATUSES.has(err.status)) {
                  console.warn(`Key "${keyEntry.label}" hit status ${err.status} on model "${modelName}".`);
                  if (i < attemptCount - 1) {
                    const backoffMs = BACKOFF_SCHEDULE_MS[Math.min(i, BACKOFF_SCHEDULE_MS.length - 1)];
                    await sleep(backoffMs);
                    continue;
                  }
                  throw err;
                }
                throw err;
              }
            }
            throw lastErr || new Error('Key rotation attempt window exhausted with no error captured.');
          }
          async function callWithFallback(prompt, useSearchGrounding) {
            let lastError = null;
            for (const modelName of modelChain) {
              try {
                const result = await callWithKeyRotation(modelName, prompt, useSearchGrounding);
                if (modelName !== GEMINI_MODEL_PRIMARY) {
                  console.warn(`NOTE: primary model "${GEMINI_MODEL_PRIMARY}" failed, succeeded using fallback model "${modelName}".`);
                }
                return result;
              } catch (err) {
                lastError = err;
                if (MODEL_UNAVAILABLE_STATUSES.has(err.status) || RATE_LIMIT_STATUSES.has(err.status)) {
                  console.warn(`Model "${modelName}" exhausted or unavailable (${err.status}) - trying next fallback model if any.`);
                  continue;
                }
                throw err;
              }
            }
            throw lastError || new Error('All Gemini models failed across every discovered model and every attempted API key.');
          }
          async function generateSeoAltText(post) {
            const storyTopic = await callWithFallback(buildIdentifyPrompt(post), false);
            const rawAlt = await callWithFallback(buildSeoPrompt(post, storyTopic), true);
            return rawAlt
              .replace(/^["']|["']$/g, '')
              .replace(/\n/g, ' ')
              .trim()
              .slice(0, 160);
          }
          function upsertImageAltField(raw, altText) {
            const safeAlt = altText.replace(/"/g, "'");
            const altLine = `image_alt: "${safeAlt}"`;
            const fmMatch = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!fmMatch) return null;
            let fmBlock = fmMatch[1];
            if (/^image_alt:\s*.*$/m.test(fmBlock)) {
              fmBlock = fmBlock.replace(/^image_alt:\s*.*$/m, altLine);
            } else if (/^image:\s*.*$/m.test(fmBlock)) {
              fmBlock = fmBlock.replace(/^(image:\s*.*)$/m, `$1\n${altLine}`);
            } else {
              fmBlock = `${fmBlock}\n${altLine}`;
            }
            return raw.replace(/^---\r?\n[\s\S]*?\r?\n---/, `---\n${fmBlock}\n---`);
          }
          const touched = [];
          const failed = [];
          for (const item of selected) {
            try {
              const altText = await generateSeoAltText(item);
              const original = readFileSync(item.file, 'utf-8');
              const updatedRaw = upsertImageAltField(original, altText);
              if (!updatedRaw) {
                console.warn(`SELF-TEST FAILED (no frontmatter block): ${item.file} - skipped.`);
                failed.push({ file: item.file, reason: 'No frontmatter block found' });
                continue;
              }
              const reparsed = matter(updatedRaw);
              if (!reparsed.data.image_alt || !reparsed.data.title) {
                console.warn(`SELF-TEST FAILED (integrity check): ${item.file} - skipped.`);
                failed.push({ file: item.file, reason: 'Post-write integrity check failed' });
                continue;
              }
              writeFileSync(item.file, updatedRaw, 'utf-8');
              touched.push({ file: item.file, title: item.title, alt: altText });
              console.log(`Generated SEO alt text for ${item.file}: "${altText}"`);
            } catch (err) {
              console.warn(`Skipped ${item.file}: ${err.message}`);
              failed.push({ file: item.file, reason: err.message });
            }
          }
          writeFileSync('/tmp/alttext-summary.json', JSON.stringify(touched, null, 2));
          writeFileSync('/tmp/alttext-model-chain.json', JSON.stringify(modelChain, null, 2));
          writeFileSync('/tmp/alttext-failed.json', JSON.stringify(failed, null, 2));
          const remainingAfterThisRun = candidates.length - selected.length;
          const summaryLines = [
            '## Auto-Generate Image Alt Text - Run Summary',
            '',
            `**Result: ${touched.length} post(s) succeeded, ${failed.length} post(s) failed.**`,
            '',
            `- API keys loaded: ${apiKeyPool.length} (${apiKeyPool.map((k) => k.label).join(', ')})`,
            `- Model chain tried, in order: \`${modelChain.join('\` -> \`')}\``,
            `- Posts scanned: ${files.length}`,
            `- Posts eligible (missing \`image_alt\`): ${candidates.length}`,
            `- Posts processed this run (cap: ${MAX_PER_RUN}): ${selected.length}`,
            remainingAfterThisRun > 0
              ? `- Posts still remaining for a future run: ${remainingAfterThisRun}`
              : '- No posts remaining - backlog fully cleared.',
            '',
            touched.length > 0
              ? '### Successfully generated:\n' + touched.map((t) => `- **${t.title}** - "${t.alt}"`).join('\n')
              : '### Successfully generated:\n(none)',
            '',
            failed.length > 0
              ? '### Failed:\n' + failed.map((f) => `- \`${f.file}\`: ${f.reason}`).join('\n')
              : '### Failed:\n(none)',
          ].join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines + '\n');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `has_changes=${touched.length > 0 ? 'true' : 'false'}\n`);
          EOF
      - name: Verify build integrity before commit
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          corepack enable
          yarn install
          yarn build
      - name: Commit generated alt text
        id: commit
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          git add src/content/posts/*.md || true
          if [ -n "$(find src/content/posts -maxdepth 1 -name '*.mdx' 2>/dev/null)" ]; then
            git add src/content/posts/*.mdx || true
          fi
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto: live-search-grounded SEO image alt text for posts (Gemini + Google Search, live model discovery)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push branch
        if: steps.commit.outputs.has_changes == 'true'
        run: git push origin "${{ steps.branch.outputs.branch_name }}"
      - name: Open Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('/tmp/alttext-summary.json')
              ? JSON.parse(fs.readFileSync('/tmp/alttext-summary.json', 'utf8'))
              : [];
            const modelChain = fs.existsSync('/tmp/alttext-model-chain.json')
              ? JSON.parse(fs.readFileSync('/tmp/alttext-model-chain.json', 'utf8'))
              : [];
            const failedList = fs.existsSync('/tmp/alttext-failed.json')
              ? JSON.parse(fs.readFileSync('/tmp/alttext-failed.json', 'utf8'))
              : [];
            const rows = summary
              .map((s) => `- **${s.title}** (\`${s.file}\`)\n  Alt: _${s.alt}_`)
              .join('\n');
            const failedRows = failedList
              .map((f) => `- \`${f.file}\`: ${f.reason}`)
              .join('\n');
            const body = [
              '## 🤖 Live-Search-Grounded SEO Image Alt Text',
              '',
              'Image pixels කිසිවක් analyze කර නැත. Post title/description/category metadata එකෙන් කතාවේ topic එක තහවුරු කරගෙන, Gemini ගේ **Google Search grounding tool** හරහා real-time search results බලා, එම කතා වර්ගය සොයන පරිශීලකයන් ඇත්තටම භාවිත කරන search keywords වලින් alt text සකස් කර ඇත.',
              '',
              `Model chain (live-discovered via ListModels API, text-generation models only, this run): \`${modelChain.join('\` → \`')}\`. API key rotation pool activated - a key hitting quota (429/403) automatically rotates to the next configured key.`,
              '',
              '### ✅ Merge කරන්න කලින් check කරන්න:',
              '- [x] `yarn build` සාර්ථකව සම්පූර්ණ විය.',
              '- [ ] Alt text descriptions manually review කරන්න.',
              '',
              '### 📝 Generated Alt Text:',
              rows || '(none)',
              failedList.length > 0 ? '\n### ⚠️ Skipped/Failed this run:\n' + failedRows : '',
              '',
              '_මෙම PR එක ස්වයංක්‍රීයව scan-and-propose කරන bot එකකින් සාදන ලදී._',
            ].join('\n');
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto: live-search-grounded SEO image alt text',
              head: process.env.BRANCH_NAME,
              base: 'main',
              body,
            });
      - name: No changes detected
        if: steps.generate.outputs.has_changes != 'true'
        run: echo "No posts needed alt-text generation this run. See the Job Summary above for full diagnostic details."
