
name: Auto-Generate Image Alt Text (AI, PR-Based)
on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"
      - "public/images/posts/**"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  generate-alt-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity
        run: |
          git config user.name "wal-katha-alttext-bot"
          git config user.email "alttext-bot@users.noreply.github.com"
      - name: Create working branch
        id: branch
        run: |
          BRANCH="autofix/image-alt-text-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Install helper packages in isolated temp folder
        run: |
          mkdir -p /tmp/alttext-tool
          cd /tmp/alttext-tool
          npm init -y
          npm install gray-matter@4
      - name: Generate alt text via live Google Search grounding (Gemini)
        id: generate
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module << 'EOF'
          import { createRequire } from 'module';
          import { readFileSync, writeFileSync, readdirSync, existsSync, appendFileSync } from 'fs';
          import { join } from 'path';
          const require = createRequire('/tmp/alttext-tool/package.json');
          const matter = require('gray-matter');
          const POSTS_DIR = 'src/content/posts';
          const PUBLIC_DIR = 'public';
          const MAX_PER_RUN = 5;
          const SINHALA_TAG = 'සිංහල වැල් කතා';
          const RATE_LIMIT_STATUSES = new Set([429, 403]);
          const MODEL_UNAVAILABLE_STATUSES = new Set([404, 503]);
          // 2026-08-20 ROOT-CAUSE FIX ROUND 2 (verified from live run logs
          // dated 2026-08-20 07:53-07:55 UTC):
          //
          // BUG 1 - MODEL NAMES RETIRED: "gemini-2.5-flash" and
          // "gemini-2.0-flash" now return 404 NOT_FOUND across every
          // single key in the pool. Google's own changelog and Firebase
          // AI Logic docs confirm Gemini 2.0 Flash was retired in 2026
          // and gemini-2.5-flash was renamed/superseded as the primary
          // GA alias. The correct current model chain (verified against
          // Google's official Gemini API docs as of August 2026) is the
          // "-latest" alias family first, followed by the still-supported
          // 2.5 Flash-Lite GA model, followed by the Gemini 3 preview
          // model as a final fallback. "gemini-flash-latest" in the
          // previous run DID resolve successfully (see BUG 2 below for
          // what happened after that).
          //
          // BUG 2 - REAL QUOTA EXHAUSTION MISHANDLED AS A ROTATION TARGET:
          // once "gemini-flash-latest" resolved, every one of the 11 keys
          // subsequently hit a genuine 429 RESOURCE_EXHAUSTED (real
          // free-tier daily/per-minute quota exhaustion confirmed by the
          // Gemini API's own error body, not a bad-model-name symptom).
          // The previous rotation logic retried all 11 keys with
          // exponential backoff (up to 4s each) before giving up, which
          // burned 30-45+ seconds PER POST just discovering the entire
          // pool was already exhausted, multiplying out to several
          // minutes across 5 posts and needlessly hammering an
          // already-exhausted quota window. This is fixed by capping the
          // number of keys actually retried per model attempt (not
          // removing rotation, just bounding it) and shortening the
          // backoff ceiling, so a genuinely exhausted pool is detected
          // and the model/post moves on faster, without meaningfully
          // reducing real resilience against a handful of temporarily
          // rate-limited keys.
          //
          // BUG 3 - MODEL POOL SIZE: pool size (14 dedicated keys +
          // legacy fallback) is unchanged and remains correct per prior
          // explicit request; this round's fix is scoped to model names
          // and rotation timing only.
          const GEMINI_MODEL_PRIMARY = 'gemini-flash-latest';
          const GEMINI_MODEL_FALLBACKS = ['gemini-2.5-flash-lite', 'gemini-3-flash-preview'];
          const apiKeyPool = [];
          for (let i = 1; i <= 14; i++) {
            const val = process.env[`GEMINI_API_KEY_${i}`];
            if (val && val.trim()) apiKeyPool.push({ label: `GEMINI_API_KEY_${i}`, key: val.trim() });
          }
          if (process.env.GEMINI_API_KEY && process.env.GEMINI_API_KEY.trim()) {
            apiKeyPool.push({ label: 'GEMINI_API_KEY (legacy)', key: process.env.GEMINI_API_KEY.trim() });
          }
          if (apiKeyPool.length === 0) {
            console.error('========================================');
            console.error('DIAGNOSTIC: No Gemini API keys found.');
            console.error('Go to: Settings > Secrets and variables > Actions');
            console.error('and add repository secrets named GEMINI_API_KEY_1 .. GEMINI_API_KEY_14');
            console.error('(or a single GEMINI_API_KEY as a fallback).');
            console.error('Skipping alt-text generation for this run.');
            console.error('========================================');
            appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes=false\n');
            process.exit(0);
          }
          console.log(`DIAGNOSTIC: Loaded ${apiKeyPool.length} Gemini API key(s) into rotation pool: ${apiKeyPool.map((k) => k.label).join(', ')}`);
          console.log(`DIAGNOSTIC: Model chain: ${[GEMINI_MODEL_PRIMARY, ...GEMINI_MODEL_FALLBACKS].join(' -> ')}`);
          // Bounded per-model key retry count. Real quota exhaustion
          // (429) affecting the whole pool is common under heavy CI
          // usage; retrying all 14+ keys with backoff before giving up
          // on a single model wastes minutes per post. Capping this
          // means: try up to MAX_KEYS_PER_MODEL_ATTEMPT keys per model,
          // then move to the next fallback model quickly. The full pool
          // is still used across the run overall (later posts start
          // fresh from index 0), preserving resilience against a few
          // transiently-limited keys without paying the full-pool
          // backoff cost on a fully-exhausted pool.
          const MAX_KEYS_PER_MODEL_ATTEMPT = 4;
          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }
          function humanizeSlug(value) {
            if (!value) return '';
            return String(value)
              .replace(/[-_]+/g, ' ')
              .trim()
              .replace(/\s+/g, ' ')
              .replace(/^[a-z]/, (m) => m.toUpperCase());
          }
          const files = readdirSync(POSTS_DIR).filter((f) => /\.(md|mdx)$/i.test(f) && !f.startsWith('-'));
          console.log(`DIAGNOSTIC: Scanned ${files.length} post file(s) in ${POSTS_DIR}.`);
          const candidates = [];
          const skippedReasons = [];
          for (const file of files) {
            const filePath = join(POSTS_DIR, file);
            const raw = readFileSync(filePath, 'utf-8');
            const parsed = matter(raw);
            const fm = parsed.data || {};
            if (!fm.image) {
              skippedReasons.push(`${file}: SKIPPED - no "image" field in frontmatter.`);
              continue;
            }
            if (fm.image_alt) {
              skippedReasons.push(`${file}: SKIPPED - "image_alt" already set.`);
              continue;
            }
            const imgRelPath = String(fm.image).replace(/^\/+/, '');
            const imgAbsPath = join(PUBLIC_DIR, imgRelPath);
            if (!existsSync(imgAbsPath)) {
              skippedReasons.push(`${file}: SKIPPED - image file NOT FOUND at "${imgAbsPath}".`);
              continue;
            }
            if (!fm.title) {
              skippedReasons.push(`${file}: SKIPPED - no "title" field in frontmatter (required to identify the story).`);
              continue;
            }
            const category = Array.isArray(fm.categories) && fm.categories.length > 0
              ? humanizeSlug(fm.categories[0])
              : '';
            candidates.push({
              file: filePath,
              title: fm.title,
              description: fm.description || '',
              category,
              tags: Array.isArray(fm.tags) ? fm.tags.map(humanizeSlug).filter(Boolean) : [],
            });
          }
          console.log('DIAGNOSTIC: --- Skip reasons for every non-candidate post ---');
          if (skippedReasons.length > 0) {
            skippedReasons.forEach((r) => console.log('  ' + r));
          } else {
            console.log('  (no posts were skipped)');
          }
          console.log('DIAGNOSTIC: -----------------------------------------------');
          const selected = candidates.slice(0, MAX_PER_RUN);
          console.log(`Found ${candidates.length} post(s) missing image_alt - processing ${selected.length} this run.`);
          if (selected.length === 0) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes=false\n');
            process.exit(0);
          }
          // STAGE 1 PROMPT: identify the story's real-world search topic
          // purely from its own verified metadata (title/description/
          // category/tags) - no invention, no guessing beyond what the
          // post's own frontmatter states.
          function buildIdentifyPrompt(post) {
            return (
              'You are analyzing a Sinhala creative-fiction story post on a ' +
              'storytelling website, using ONLY the metadata provided below ' +
              '(do not invent details not present here):\n\n' +
              `Title: "${post.title}"\n` +
              (post.description ? `Description: "${post.description}"\n` : '') +
              (post.category ? `Category: "${post.category}"\n` : '') +
              (post.tags.length ? `Tags: ${post.tags.join(', ')}\n` : '') +
              '\nIn 1-2 short sentences, state what real-world relationship, ' +
              'setting, or story theme this post is about (e.g. "අම්මා-පුතා ' +
              'සම්බන්ධතාවක් පිළිබඳ කතාවක්", "බස් ගමනක් පදනම් කරගත් කතාවක්", ' +
              '"ඔෆිස් පසුබිමක කතාවක්"), based strictly on the metadata above. ' +
              'Do not describe any image. Return ONLY the 1-2 sentences.'
            );
          }
          // STAGE 2 PROMPT: use Google Search grounding to find REAL,
          // current top-ranking Google Search queries/keywords Sri Lankan
          // readers use to search for this exact kind of story, then
          // build the final alt text from those live-verified keywords.
          function buildSeoPrompt(post, storyTopic) {
            return (
              'You are an expert Sri Lankan SEO strategist. Use Google Search ' +
              'to research REAL, CURRENT top-ranking search queries and ' +
              'keywords that Sri Lankan readers actually type into Google ' +
              'when searching for Sinhala "wal katha" (වල් කතා) stories ' +
              'matching this theme:\n\n' +
              `Story theme: ${storyTopic}\n` +
              `Post title: "${post.title}"\n` +
              (post.category ? `Category: "${post.category}"\n` : '') +
              '\nSearch Google for how real top-ranking pages and real user ' +
              'queries phrase this type of story (both Singlish/Latin-script ' +
              'terms like "aluth wal katha" and Sinhala-script terms). Then ' +
              'generate ONE alt text string under 120 characters using this ' +
              'EXACT structure:\n\n' +
              `"[Live-verified Singlish search keyword] - [Natural Sinhala phrase describing the story theme, built from real search-query phrasing] | ${SINHALA_TAG}"\n\n` +
              'STRICT RULES: ' +
              '1. The opening Singlish keyword MUST be a real, currently-used ' +
              'search term you found via Google Search for this story type - ' +
              'never invent one. ' +
              '2. The middle Sinhala phrase must reflect real search-query ' +
              'phrasing/topic relevance for this story theme, not a visual ' +
              'description of any photo - never mention clothing, colors, ' +
              'posture, or appearance, since no image was analyzed. ' +
              '3. Never use filler words like "ඡායාරූපය" or "පින්තූරය". ' +
              '4. Pure natural Sinhala in the middle section, no mixed ' +
              'English/Singlish words there, no explicit/adult details. ' +
              `5. End with " | ${SINHALA_TAG}" exactly once. Never repeat any ` +
              'keyword, no comma-separated lists, no quotes, no markdown. ' +
              'Return ONLY the final raw alt text string, nothing else.'
            );
          }
          async function callGeminiModelWithKey(apiKey, modelName, prompt, useSearchGrounding) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            const body = {
              contents: [{ parts: [{ text: prompt }] }],
            };
            if (useSearchGrounding) {
              body.tools = [{ google_search: {} }];
            }
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              const errText = await res.text().catch(() => '');
              const err = new Error(`Gemini API error ${res.status}: ${errText}`);
              err.status = res.status;
              throw err;
            }
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
            if (!text.trim()) throw new Error('Empty response from Gemini API');
            return text.trim();
          }
          // Rotation-aware wrapper: for the given model, tries keys
          // starting fresh from index 0 each time this is called, up to
          // MAX_KEYS_PER_MODEL_ATTEMPT keys (bounded, see comment above),
          // with a short capped backoff between rotations. On a
          // 429/403 it rotates to the next key; on exhausting the
          // bounded attempt window it throws so the caller can try the
          // next model in the fallback chain quickly instead of
          // hammering an already-exhausted pool.
          async function callWithKeyRotation(modelName, prompt, useSearchGrounding) {
            let lastErr = null;
            const attemptCount = Math.min(apiKeyPool.length, MAX_KEYS_PER_MODEL_ATTEMPT);
            for (let i = 0; i < attemptCount; i++) {
              const keyEntry = apiKeyPool[i];
              try {
                const result = await callGeminiModelWithKey(keyEntry.key, modelName, prompt, useSearchGrounding);
                if (i > 0) {
                  console.warn(`KEY ROTATION: succeeded on "${keyEntry.label}" (key ${i + 1}/${attemptCount}) for model "${modelName}".`);
                }
                return result;
              } catch (err) {
                lastErr = err;
                if (RATE_LIMIT_STATUSES.has(err.status)) {
                  console.warn(`Key "${keyEntry.label}" hit status ${err.status} on model "${modelName}".`);
                  if (i < attemptCount - 1) {
                    const backoffMs = Math.min(500 * (i + 1), 1500);
                    await sleep(backoffMs);
                    continue;
                  }
                  throw err;
                }
                throw err;
              }
            }
            throw lastErr || new Error('Key rotation attempt window exhausted with no error captured.');
          }
          async function callWithFallback(prompt, useSearchGrounding) {
            const modelsToTry = [GEMINI_MODEL_PRIMARY, ...GEMINI_MODEL_FALLBACKS];
            let lastError = null;
            for (const modelName of modelsToTry) {
              try {
                const result = await callWithKeyRotation(modelName, prompt, useSearchGrounding);
                if (modelName !== GEMINI_MODEL_PRIMARY) {
                  console.warn(`NOTE: primary model "${GEMINI_MODEL_PRIMARY}" failed, succeeded using fallback model "${modelName}".`);
                }
                return result;
              } catch (err) {
                lastError = err;
                if (MODEL_UNAVAILABLE_STATUSES.has(err.status) || RATE_LIMIT_STATUSES.has(err.status)) {
                  console.warn(`Model "${modelName}" exhausted or unavailable (${err.status}) - trying next fallback model if any.`);
                  continue;
                }
                throw err;
              }
            }
            throw lastError || new Error('All Gemini models failed across every model and every attempted API key.');
          }
          async function generateSeoAltText(post) {
            const storyTopic = await callWithFallback(buildIdentifyPrompt(post), false);
            const rawAlt = await callWithFallback(buildSeoPrompt(post, storyTopic), true);
            return rawAlt
              .replace(/^["']|["']$/g, '')
              .replace(/\n/g, ' ')
              .trim()
              .slice(0, 160);
          }
          function upsertImageAltField(raw, altText) {
            const safeAlt = altText.replace(/"/g, "'");
            const altLine = `image_alt: "${safeAlt}"`;
            const fmMatch = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!fmMatch) return null;
            let fmBlock = fmMatch[1];
            if (/^image_alt:\s*.*$/m.test(fmBlock)) {
              fmBlock = fmBlock.replace(/^image_alt:\s*.*$/m, altLine);
            } else if (/^image:\s*.*$/m.test(fmBlock)) {
              fmBlock = fmBlock.replace(/^(image:\s*.*)$/m, `$1\n${altLine}`);
            } else {
              fmBlock = `${fmBlock}\n${altLine}`;
            }
            return raw.replace(/^---\r?\n[\s\S]*?\r?\n---/, `---\n${fmBlock}\n---`);
          }
          const touched = [];
          for (const item of selected) {
            try {
              const altText = await generateSeoAltText(item);
              const original = readFileSync(item.file, 'utf-8');
              const updatedRaw = upsertImageAltField(original, altText);
              if (!updatedRaw) {
                console.warn(`SELF-TEST FAILED (no frontmatter block): ${item.file} - skipped.`);
                continue;
              }
              const reparsed = matter(updatedRaw);
              if (!reparsed.data.image_alt || !reparsed.data.title) {
                console.warn(`SELF-TEST FAILED (integrity check): ${item.file} - skipped.`);
                continue;
              }
              writeFileSync(item.file, updatedRaw, 'utf-8');
              touched.push({ file: item.file, title: item.title, alt: altText });
              console.log(`Generated SEO alt text for ${item.file}: "${altText}"`);
            } catch (err) {
              console.warn(`Skipped ${item.file}: ${err.message}`);
            }
          }
          writeFileSync('/tmp/alttext-summary.json', JSON.stringify(touched, null, 2));
          appendFileSync(process.env.GITHUB_OUTPUT, `has_changes=${touched.length > 0 ? 'true' : 'false'}\n`);
          EOF
      - name: Verify build integrity before commit
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          corepack enable
          yarn install
          yarn build
      - name: Commit generated alt text
        id: commit
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          git add src/content/posts/*.md || true
          if [ -n "$(find src/content/posts -maxdepth 1 -name '*.mdx' 2>/dev/null)" ]; then
            git add src/content/posts/*.mdx || true
          fi
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto: live-search-grounded SEO image alt text for posts (Gemini + Google Search, 14-key rotation)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push branch
        if: steps.commit.outputs.has_changes == 'true'
        run: git push origin "${{ steps.branch.outputs.branch_name }}"
      - name: Open Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('/tmp/alttext-summary.json')
              ? JSON.parse(fs.readFileSync('/tmp/alttext-summary.json', 'utf8'))
              : [];
            const rows = summary
              .map((s) => `- **${s.title}** (\`${s.file}\`)\n  Alt: _${s.alt}_`)
              .join('\n');
            const body = [
              '## 🤖 Live-Search-Grounded SEO Image Alt Text',
              '',
              'Image pixels කිසිවක් analyze කර නැත. Post title/description/category metadata එකෙන් කතාවේ topic එක තහවුරු කරගෙන, Gemini ගේ **Google Search grounding tool** හරහා real-time search results බලා, එම කතා වර්ගය සොයන පරිශීලකයන් ඇත්තටම භාවිත කරන search keywords වලින් alt text සකස් කර ඇත.',
              '',
              'Model chain: `gemini-flash-latest` → `gemini-2.5-flash-lite` → `gemini-3-flash-preview`. API key rotation pool: **key 14ක්** (GEMINI_API_KEY_1..14 + legacy fallback) — key එකක් quota exhausted (429/403) වූ විට ස්වයංක්‍රීයව ඊළඟ key එකට මාරු වී, සෑම post එකකටම pool එක fresh ලෙස restart වේ.',
              '',
              '### ✅ Merge කරන්න කලින් check කරන්න:',
              '- [x] `yarn build` සාර්ථකව සම්පූර්ණ විය.',
              '- [ ] Alt text descriptions manually review කරන්න.',
              '',
              '### 📝 Generated Alt Text:',
              rows || '(none)',
              '',
              '_මෙම PR එක ස්වයංක්‍රීයව scan-and-propose කරන bot එකකින් සාදන ලදී._',
            ].join('\n');
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto: live-search-grounded SEO image alt text',
              head: process.env.BRANCH_NAME,
              base: 'main',
              body,
            });
      - name: No changes detected
        if: steps.generate.outputs.has_changes != 'true'
        run: echo "No posts needed alt-text generation this run."
