name: Auto-Fix URL Issues (PR-Based)

# මෙම workflow එක main branch එකට කෙලින්ම commit කරන්නේ නැත.
# වෙනුවට: 1) ගැටලු scan කරනවා  2) අලුත් branch එකක fix කරනවා
# 3) Pull Request එකක් විවෘත කරනවා — ඔබ review කරලා merge කරන තුරු
# කිසිම වෙනසක් site එකට යන්නේ නැත.

on:
  workflow_dispatch: {}
  # ⚠️ schedule trigger එක disable කර ඇත — කලින් sed bug එකක් නිසා
  # weekly auto-run එකෙන් Posts.astro/SimilarPosts.astro/FeaturedSlider.astro
  # හි href={`/blog/${post.id}`} corrupt වී href={`/blog/post.id`} බවට
  # හැරී site එකම broken වුණා. දැන් self-test step එකක් එකතු කර ඇති
  # නමුත්, safety එකට schedule එක manual විදිහටම තබා ඇත. අවශ්‍ය නම්
  # පහත comment එක ඉවත් කර නැවත schedule කරගත හැක.
  # schedule:
  #   - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "wal-katha-autofix-bot"
          git config user.email "autofix-bot@users.noreply.github.com"

      - name: Create working branch
        id: branch
        run: |
          BRANCH="autofix/url-issues-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Detect & fix uppercase content filenames
        id: rename
        run: |
          echo "🔍 Scanning src/content/posts/ for uppercase filenames..."
          CHANGED=0
          RENAME_LOG="/tmp/rename-log.txt"
          : > "$RENAME_LOG"

          for file in src/content/posts/*.md src/content/posts/*.mdx; do
            [ -e "$file" ] || continue

            base=$(basename "$file")

            # "-index.md" වගේ special/system files touch කරන්නේ නෑ
            if [[ "$base" == -* ]]; then
              continue
            fi

            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')

            if [ "$base" != "$lower" ]; then
              dir=$(dirname "$file")
              old_path="$file"
              new_path="$dir/$lower"

              tmp_path="$dir/__tmp_rename__$lower"
              git mv "$old_path" "$tmp_path"
              git mv "$tmp_path" "$new_path"

              echo "RENAMED: $old_path -> $new_path" >> "$RENAME_LOG"
              CHANGED=1
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "---- Rename Summary ----"
          cat "$RENAME_LOG" || echo "No renames needed."

      - name: Fix trailing-slash href mismatches
        id: hrefs
        run: |
          echo "🔍 Scanning known components for trailing-slash href mismatches..."
          HREF_CHANGED=0
          HREF_LOG="/tmp/href-log.txt"
          : > "$HREF_LOG"

          TARGET_FILES=(
            "src/layouts/components/Posts.astro"
            "src/layouts/components/SimilarPosts.astro"
            "src/layouts/components/FeaturedSlider.astro"
          )

          for f in "${TARGET_FILES[@]}"; do
            [ -e "$f" ] || continue

            # ✅ FIXED: replacement string එකේ ${ } දෙකම literal ලෙස
            # නැවත insert කරනවා. පරණ bug එකේදී replacement string එකේ
            # backtick ඇතුළත ${ } අකුරු අහම්බෙන් මැකිලා ගියා
            # (href={`/blog/post.id`} වගේ broken output එකක් හැදුනා).
            # දැන් \$\{ සහ \} explicit escape කර ඇති නිසා, replacement
            # string එකේ literal ${...} නිවැරදිව නැවත ලියැවේ.
            if grep -qE 'href=\{`/blog/\$\{[^}]+\}/`\}' "$f"; then
              cp "$f" "$f.bak"
              sed -i -E 's#href=\{`/blog/\$\{([^}]+)\}/`\}#href={`/blog/\$\{\1\}`}#g' "$f"

              # 🛡️ SELF-TEST GUARD: replace කරාට පස්සේ file එකේ තවමත්
              # literal "${" පේනවද කියලා verify කරනවා. නැත්නම් (පරණ
              # bug එකේ වගේ) මේ step එකම fail කරලා, ගොනුව backup එකෙන්
              # restore කරලා, safety එකට commit/push නවතිනවා.
              if ! grep -qE 'href=\{`/blog/\$\{[a-zA-Z0-9_.]+\}`\}' "$f"; then
                echo "❌ SELF-TEST FAILED: sed replacement did not produce valid \${...} syntax in $f"
                echo "   Restoring original file to prevent corruption."
                cp "$f.bak" "$f"
                rm "$f.bak"
                echo "SELF-TEST FAILED — no changes applied to: $f" >> "$HREF_LOG"
                continue
              fi

              rm "$f.bak"
              echo "FIXED trailing-slash href in: $f" >> "$HREF_LOG"
              HREF_CHANGED=1
            fi
          done

          echo "changed=$HREF_CHANGED" >> "$GITHUB_OUTPUT"
          echo "---- Href Fix Summary ----"
          cat "$HREF_LOG" || echo "No href fixes needed."

      - name: Update internal references after rename
        if: steps.rename.outputs.changed == '1'
        run: |
          echo "🔍 Updating any internal markdown/config references to renamed files..."
          while IFS= read -r line; do
            old=$(echo "$line" | sed -E 's/RENAMED: (.*) -> .*/\1/' | xargs basename)
            new=$(echo "$line" | sed -E 's/.*-> (.*)/\1/' | xargs basename)
            old_noext="${old%.*}"
            new_noext="${new%.*}"

            if [ "$old_noext" != "$new_noext" ]; then
              grep -rlZ --include="*.md" --include="*.mdx" --include="*.astro" \
                "$old_noext" src/ 2>/dev/null | \
                xargs -0 -r sed -i "s/$old_noext/$new_noext/g"
            fi
          done < /tmp/rename-log.txt

      - name: Verify build integrity before commit
        run: |
          # 🛡️ ADDITIONAL SAFETY NET: href fix කරපු targeted files 3ම
          # scan කරලා, "post.id" හෝ "slide.id" කියන broken-literal
          # pattern එකක් (${ } නැතිව) කොහෙන්හරි ඉතුරු වෙලා තියෙනවද
          # කියලා අවසාන වරටත් check කරනවා. මොනවහරි හම්බුනොත්
          # workflow එකම fail කරලා, කිසිම PR එකක් create වෙන්නේ නෑ.
          BROKEN_FOUND=0
          TARGET_FILES=(
            "src/layouts/components/Posts.astro"
            "src/layouts/components/SimilarPosts.astro"
            "src/layouts/components/FeaturedSlider.astro"
          )
          for f in "${TARGET_FILES[@]}"; do
            [ -e "$f" ] || continue
            if grep -qE 'href=\{`/blog/(post|slide)\.id`\}' "$f"; then
              echo "❌ CRITICAL: Found broken literal href in $f (missing \${...})"
              BROKEN_FOUND=1
            fi
            if grep -qE 'href=\{`/blog/sanitizeUrlPath\([a-zA-Z0-9_.]+\)`\}' "$f"; then
              echo "❌ CRITICAL: Found broken literal function-call href in $f (missing \${...})"
              BROKEN_FOUND=1
            fi
          done

          if [ "$BROKEN_FOUND" -eq 1 ]; then
            echo "🛑 Aborting workflow — broken href pattern detected. No commit will be made."
            exit 1
          fi
          echo "✅ No broken href literals found."

      - name: Commit changes
        id: commit
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ No issues found — nothing to fix."
          else
            git commit -m "Auto-fix: lowercase content filenames + trailing-slash href mismatches"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.commit.outputs.has_changes == 'true'
        run: git push origin "${{ steps.branch.outputs.branch_name }}"

      - name: Open Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const renameLog = require('fs').existsSync('/tmp/rename-log.txt')
              ? require('fs').readFileSync('/tmp/rename-log.txt', 'utf8').trim()
              : '';
            const hrefLog = require('fs').existsSync('/tmp/href-log.txt')
              ? require('fs').readFileSync('/tmp/href-log.txt', 'utf8').trim()
              : '';

            const body = [
              '## 🤖 Auto-Detected URL Issues',
              '',
              '### ⚠️ Merge කරන්න කලින් මේවා check කරන්න:',
              '',
              '- [ ] මෙම PR එකෙන් content file(s) rename වෙනවා නම්, ඒවායේ URL slug එකත් වෙනස් වේ.',
              '- [ ] **Facebook/WhatsApp/Telegram වලට කලින් share කරපු පරණ URL තිබේ නම්**, `_redirects` file එකකින් 301 redirect එකක් manual ලෙස එකතු කරන්න (මෙම PR එකෙන් ඒක auto-add වන්නේ නැත).',
              '- [ ] `yarn build` local එකේ test කරලා confirm කරන්න.',
              '- [ ] **Self-test guard passed** — මෙම PR එකේ href fixes ස්වයංක්‍රීයව verify කර ඇත, `${...}` syntax නිවැරදිව ඇත.',
              '',
              '### 📁 Renamed files:',
              '```',
              renameLog || '(none)',
              '```',
              '',
              '### 🔗 Fixed trailing-slash hrefs:',
              '```',
              hrefLog || '(none)',
              '```',
              '',
              '_මෙම PR එක ස්වයංක්‍රීයව scan-and-propose කරන bot එකකින් සාදන ලදී. Direct commit කිසිවක් main branch එකට සිදු වී නැත._'
            ].join('\n');

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto-fix: URL case & trailing-slash issues',
              head: '${{ steps.branch.outputs.branch_name }}',
              base: 'main',
              body: body,
            });

      - name: Build check (informational, does not block PR creation)
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build
        continue-on-error: true
